<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b5ed7"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="أسعار الجوالات"><meta property="og:title" content="أسعار الجوالات والاكسسوارات"><meta property="og:description" content="أسعار الجوالات والتابلت والاكسسوارات مع الأكواد والمواصفات">
<title>أسعار الجوالات والاكسسوارات</title>
<link rel="icon" href="icons/icon-192.png"><link rel="apple-touch-icon" href="icons/icon-192.png"><link rel="manifest" href="manifest.json">
<style>
:root{--bg:#f2f5fa;--card:#fff;--tx:#17212f;--mu:#6b778a;--pr:#0b5ed7;--ln:#e3e8f0;--ok:#16a34a}
[data-t=dark]{--bg:#0e141c;--card:#18212c;--tx:#e8eef6;--mu:#93a1b5;--pr:#5aa2ff;--ln:#26323f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;touch-action:manipulation}
body{display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
button{font:inherit;color:inherit;cursor:pointer}
header{background:var(--pr);color:#fff;display:flex;align-items:center;gap:6px;padding:8px 10px}
header img{width:34px;height:34px;border-radius:9px}
header h1{font-size:14px;margin:0;flex:1;line-height:1.3}
.hb{background:rgba(255,255,255,.18);border:0;border-radius:10px;color:#fff;padding:7px 9px;font-size:13px}
main{flex:1;overflow-y:auto;padding:10px 10px 14px;-webkit-overflow-scrolling:touch}
footer{display:flex;background:var(--card);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom)}
footer button{flex:1;background:0;border:0;padding:8px 2px;font-size:11px;color:var(--mu)}
footer button b{display:block;font-size:19px;font-weight:400}
footer button.on{color:var(--pr);font-weight:700}
input,select,textarea{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--ln);border-radius:10px;padding:9px;width:100%}
.srch{display:flex;gap:6px;margin-bottom:10px}
.big{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.big button{background:var(--pr);color:#fff;border:0;border-radius:16px;padding:16px 8px;font-size:15px;font-weight:700}
.big button b{display:block;font-size:34px;font-weight:400}
.big button small{display:block;font-weight:400;opacity:.85;font-size:11px;margin-top:2px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.br{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:8px 4px;text-align:center;font-size:12px;min-height:84px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px}
.br .lg{height:34px;width:70px;display:flex;align-items:center;justify-content:center;font-size:24px}
.br img{max-height:34px;max-width:64px}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--ln);border-radius:12px;overflow:hidden;font-size:13px}
th{background:var(--pr);color:#fff;padding:8px 6px;text-align:right;font-size:12px}
td{padding:9px 6px;border-top:1px solid var(--ln);vertical-align:middle}
tr.r{cursor:pointer}
.cd{font-family:ui-monospace,Consolas,monospace;font-weight:700;color:var(--pr);white-space:nowrap}
.pc{color:var(--ok);font-weight:800;white-space:nowrap}
.pc small{font-weight:400;color:var(--mu)}
.st{background:0;border:0;font-size:19px;padding:0 2px}
.tag{font-size:10px;background:#f59e0b22;color:#d97706;padding:1px 6px;border-radius:8px;margin-inline-start:4px}
h2{font-size:15px;margin:12px 2px 8px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px}
.chip{white-space:nowrap;background:var(--card);border:1px solid var(--ln);border-radius:20px;padding:6px 12px;font-size:12px}
.chip.on{background:var(--pr);color:#fff;border-color:var(--pr)}
.md{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:14px;z-index:9}
.bx{background:var(--card);border-radius:18px;padding:16px;width:100%;max-width:440px;max-height:88vh;overflow-y:auto}
.bx h3{margin:0 0 4px;font-size:16px;line-height:1.5}
.sp{display:flex;gap:8px;border-bottom:1px solid var(--ln);padding:7px 0;font-size:13px}
.sp b{width:92px;flex:none;color:var(--mu);font-weight:600}
.bc{background:#fff;border-radius:10px;padding:8px;margin-top:10px;text-align:center;color:#000}
.bc svg{width:100%;height:78px}
.bc div{font-family:ui-monospace,Consolas,monospace;font-weight:700;letter-spacing:3px;font-size:15px}
.btn{background:var(--pr);color:#fff;border:0;border-radius:11px;padding:10px 14px;font-size:13px;margin:4px 3px 0}
.btn.g{background:var(--ln);color:var(--tx)}.btn.r{background:#dc2626}
.note{background:#f59e0b1a;border-radius:10px;padding:8px;font-size:12px;margin-top:8px}
#upd{display:none;background:#f59e0b;color:#000;padding:8px 10px;font-size:13px;align-items:center;gap:8px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:12px;margin-bottom:8px;font-size:13px;line-height:1.8}
.li{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--ln);font-size:14px}
.fab{position:fixed;bottom:calc(66px + env(safe-area-inset-bottom));left:14px;width:52px;height:52px;border-radius:50%;background:var(--ok);color:#fff;border:0;font-size:28px;box-shadow:0 4px 12px #0004;z-index:5}
.fl{font-size:12px;color:var(--mu);margin:8px 0 2px}
.wm{text-align:center;color:var(--mu);font-size:11px;margin-top:10px}
</style></head><body>
<div id="upd"><span style="flex:1">🔔 تتوفر نسخة جديدة من التطبيق، برجاء التحديث.</span><button class="btn" onclick="doUpdate()">تحديث</button></div>
<header><img src="icons/icon-192.png" alt=""><h1>أسعار الجوالات والاكسسوارات</h1>
<button class="hb" id="bi" style="display:none" onclick="inst()">⬇ تثبيت</button>
<button class="hb" onclick="go('search')">🔍</button><button class="hb" onclick="syncNow(1)">🔄</button><button class="hb" onclick="shareApp()">📤</button></header>
<main id="app"></main>
<footer id="nav"></footer>
<script src="config.js?v=1.0.0"></script>
<script src="app.js?v=1.0.0"></script>
<script>if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js?v=1.0.0").catch(function(){});</script>
</body></html>
